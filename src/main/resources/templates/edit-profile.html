<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Lab Profile</title>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease;
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            color: #1e293b;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        .btn-save {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-save:hover {
            background: #1d4ed8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>

</head>
<body>

<div class="container">
    <h2>Edit Lab Profile</h2>

    <form action="/lab/lab/profile/update" method="post" th:object="${lab}">
        
        <input type="hidden" th:field="*{id}">

        <label>Lab Name</label>
        <input type="text" th:field="*{labName}" required>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>

        <label>Phone</label>
        <input type="text" th:field="*{phone}" required>

        <label>City</label>
        <input type="text" th:field="*{city}" required>

        <label>Pincode</label>
        <input type="number" th:field="*{pincode}" required>

        <label>Address</label>
        <input type="text" th:field="*{address}" required>

        <button type="submit" class="btn-save">Save Changes</button>

    </form>
</div>

</body>
</html>
