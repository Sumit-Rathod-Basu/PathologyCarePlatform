<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Patient</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            padding: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 850px;
            margin: auto;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #4f46e5;
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .btn {
            background: #4f46e5;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
        }

        .btn:hover {
            background: #4338ca;
        }

        .flex {
            display: flex;
            gap: 15px;
        }

        .flex div {
            flex: 1;
        }
    </style>

</head>
<body>

<div class="card">
    <h2>Patient Registration</h2>

    <form th:action="@{/lab/patient/save}" th:object="${labPatient}" method="post">

        <!-- Title + Full Name -->
        <div class="flex">
            <div>
                <label>Title</label>
                <select th:field="*{title}">
                    <option value="Mr">Mr</option>
                    <option value="Ms">Ms</option>
                    <option value="Mrs">Mrs</option>
                </select>
            </div>

            <div>
                <label>Full Name</label>
                <input type="text" th:field="*{fullName}" placeholder="Enter full name" required>
            </div>
        </div>

        <!-- Mobile Numbers -->
        <div class="flex">
            <div>
                <label>Mobile Number</label>
                <input type="text" th:field="*{mobile}" placeholder="Primary Mobile Number">
            </div>

            <div>
                <label>Alternate Mobile</label>
                <input type="text" th:field="*{altMobile}" placeholder="Alternate Mobile">
            </div>
        </div>

        <!-- Age + Gender -->
        <div class="flex">
            <div>
                <label>Age</label>
                <input type="text" th:field="*{age}" placeholder="Age">
            </div>

            <div>
                <label>Gender</label>
                <select th:field="*{gender}">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <!-- Email + Area -->
        <div class="flex">
            <div>
                <label>Email</label>
                <input type="text" th:field="*{email}" placeholder="Email Address">
            </div>

            <div>
                <label>Area / Address</label>
                <input type="text" th:field="*{area}" placeholder="Address or Area">
            </div>
        </div>

        <button type="submit" class="btn">Register Patient</button>
    </form>
</div>

</body>
</html>
