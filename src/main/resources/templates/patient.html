<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - Pathology Care Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="max-w-lg mx-auto mt-12 bg-white shadow-lg rounded-xl p-8">

        <!-- Title -->
        <h2 class="text-3xl font-extrabold text-center text-teal-700 mb-4">
            Patient Registration
        </h2>

        <!-- Error Message -->
        <div th:if="${error}" 
             class="mb-4 bg-red-100 text-red-700 p-3 rounded-lg text-center font-semibold">
            <span th:text="${error}"></span>
        </div>

        <!-- Success Message -->
        <div th:if="${success}" 
             class="mb-4 bg-green-100 text-green-700 p-3 rounded-lg text-center font-semibold">
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/patients/insert}" method="post" class="space-y-4">

            <!-- Name -->
            <div>
                <label class="font-semibold">Full Name</label>
                <input type="text" name="name" class="w-full mt-1 p-2 border rounded-lg" required>
            </div>

            <!-- Email -->
            <div>
                <label class="font-semibold">Email (Unique)</label>
                <input type="email" name="email" class="w-full mt-1 p-2 border rounded-lg" required>
            </div>

            <!-- Phone -->
            <div>
                <label class="font-semibold">Phone</label>
                <input type="text" name="phone" class="w-full mt-1 p-2 border rounded-lg" required>
            </div>

            <!-- Address -->
            <div>
                <label class="font-semibold">Address</label>
                <input type="text" name="address" class="w-full mt-1 p-2 border rounded-lg" required>
            </div>

            <!-- Gender -->
            <div>
                <label class="font-semibold">Gender</label>
                <select name="gender" class="w-full mt-1 p-2 border rounded-lg" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <!-- Password -->
            <div>
                <label class="font-semibold">Password (Case Sensitive)</label>
                <input type="password" name="password" class="w-full mt-1 p-2 border rounded-lg" required>
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="font-semibold">Confirm Password</label>
                <input type="password" name="confirmPassword" class="w-full mt-1 p-2 border rounded-lg" required>
            </div>

            <!-- Button -->
            <button type="submit" 
                    class="w-full bg-teal-600 text-white py-2 rounded-lg font-semibold hover:bg-teal-700">
                Register
            </button>

            <p class="text-center mt-3">
                Already have an account?
                <a href="/patient/login" class="text-teal-600 font-semibold hover:underline">
                    Login here
                </a>
            </p>
        </form>

    </div>

</body>
</html>
