<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lab Location</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>

<div id="map"></div>

<script th:inline="javascript">
    // Lab info from backend
    var lab = {
        name: /*[[${lab.labName}]]*/,
        address: /*[[${lab.address}]]*/
    };
</script>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    // Initialize map (temporary center, will update after geocoding)
    var map = L.map('map').setView([20.5937, 78.9629], 5); // India center

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Use Nominatim (OpenStreetMap) to geocode the address
    fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(lab.address))
        .then(response => response.json())
        .then(data => {
            if (data && data.length > 0) {
                var lat = data[0].lat;
                var lon = data[0].lon;

                // Set map view to lab location
                map.setView([lat, lon], 15);

                // Add marker
                var marker = L.marker([lat, lon]).addTo(map);
                marker.bindPopup("<b>" + lab.name + "</b><br>" + lab.address).openPopup();
            } else {
                alert("Could not find the lab location.");
            }
        })
        .catch(err => console.error(err));
</script>

</body>
</html>
