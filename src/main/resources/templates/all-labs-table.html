<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registered Labs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e0f7fa, #ffffff);
        }

        .card-box {
            margin-top: 40px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.1);
        }

        .table thead {
            background-color: #00695c;
            color: white;
        }

        .table-hover tbody tr:hover {
            background-color: #f1fdfc;
            transition: 0.3s;
        }

        .badge-license {
            background-color: #198754;
        }

        .action-btn {
            font-size: 13px;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card-box">

        <h2 class="text-center text-success mb-4">
            🏥 Registered Pathology Labs
        </h2>

        <table class="table table-bordered table-hover text-center align-middle">

            <thead>
            <tr>
                <th>ID</th>
                <th>Lab Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>City</th>
                <th>Pincode</th>
                <th>Address</th>
                <th>License No</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="lab : ${labs}">
                <td th:text="${lab.id}"></td>
                <td th:text="${lab.labName}"></td>
                <td th:text="${lab.email}"></td>
                <td th:text="${lab.phone}"></td>
                <td th:text="${lab.city}"></td>
                <td th:text="${lab.pincode}"></td>
                <td th:text="${lab.address}"></td>

                <td>
                    <span class="badge badge-license"
                          th:text="${lab.registrationNumber}">
                    </span>
                </td>

                <td>
                    <a th:href="@{'/lab/view/' + ${lab.id}}"
                       class="btn btn-primary action-btn">View</a>

                    <a th:href="@{'/lab/edit/' + ${lab.id}}"
                       class="btn btn-warning action-btn">Edit</a>

                    <a th:href="@{'/lab/delete/' + ${lab.id}}"
                       class="btn btn-danger action-btn"
                       onclick="return confirm('Are you sure?')">
                       Delete
                    </a>
                </td>

            </tr>

            </tbody>

        </table>

    </div>
</div>

</body>
</html>
