<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Lab Report Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            color: #000;
        }
        .invoice-box {
            max-width: 900px;
            margin: auto;
            padding: 25px;
            border: 1px solid #000;
           
               border-top: none !important;
    border-right: none !important;
    border-bottom: none !important;
    border-left: none !important; 
        }

        .header-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .sub-heading {
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .bw-table th,
        .bw-table td {
            border: 1px solid #000 !important;
        }
        .letterhead-header {
    height: 0px;  /* space for logo or title */
    width: 100%;
}

.letterhead-footer {
    height: 55px;   /* space for footer notes or signature */
    width: 100%;
    margin-top: 20px;
}


        .bw-table th {
            background: #eaeaea !important;
            color: #000 !important;
        }

        .qr-section img {
            width: 120px;
            height: 120px;
            margin-left: 10px;
        }

        .footer {
            text-align: center;
            border-top: 1px solid #000;
            margin-top: 30px;
            padding-top: 10px;
            font-size: 14px;
        }

        .signature-section {
            margin-top: 50px;
            display: flex;
            justify-content: space-between;
        }

        .signature-block {
            text-align: center;
            width: 45%;
        }

        .signature-block img {
            width: 120px;
        }

        @media print {
            .btn-container {
                display: none !important;
            }

            body {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body>

<!-- Buttons -->
<div class="text-center mb-3 btn-container">
    <button onclick="printInvoice()" class="btn btn-primary">🖨 Print Invoice</button>
    <!-- <button onclick="downloadPDF()" class="btn btn-success">📄 Save as PDF</button> -->
</div>

<div id="invoice" class="invoice-box">

    <!-- Header -->
    <!-- <div class="header-title"></div>
    <div class="sub-heading"></div> -->
    <div class="letterhead-header">
    <!-- Leave empty for now, can add logo or text later -->
</div>

    <!-- Patient Details -->
    <div class="row mb-3">
        <div class="col-8">
            <p>
                <strong>Patient Name:</strong> <span th:text="${patientName}"></span><br>
                <strong>Patient ID:</strong> <span th:text="${patientId}"></span><br>
                <strong>Mobile:</strong> <span th:text="${patientMobile}"></span><br>
                <strong>Email:</strong> <span th:text="${patientEmail}"></span><br>
               <strong>Completed-Date:</strong> <span th:text="${#dates.format(#dates.createNow(), 'dd-MM-yyyy')}"></span>

            </p>
        </div>
        <!-- QR + Barcode -->
        <div class="col-4 qr-section text-end">
           <img th:src="'data:image/png;base64,' + ${barcode}" 
     alt="Barcode" 
     style="width: 200px; height: 50px;"/>

        </div>
      

    </div>

    <!-- Table -->
    <table class="table bw-table">
        <thead>
        <tr>
            <th>Sr No</th>
            <th>Test Name</th>
            <th>Value</th>
            <th>Unit</th>
            <th>Reference Range</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="test, iter : ${tests}">
            <td th:text="${iter.count}"></td>
            <td th:text="${test.testField}"></td>
            <td th:text="${test.testValue}"></td>
            <td th:text="${test.unit}"></td>
            <td th:text="${test.testRange}"></td>
        </tr>
        </tbody>
    </table>

<div class="report-summary mt-3 p-3 border rounded" style="background-color: #f9f9f9;">
    <h5>Report Summary</h5>
    <ul>
        <li th:each="point : ${summaryPoints}" th:text="${point}"></li>
    </ul>
</div>
   <br>
   


<!-- Doctor Sign + Lab Seal -->
    <div class="signature-section">
        <div class="signature-block">
            <!-- <img th:src="'data:image/png;base64,' + ${doctorSign}" alt="Doctor Signature"/> -->
            <img th:src="@{/images/sign.jpg}" alt="Lab Seal"/>
            <p><strong>Dr. [[${doctorName}]]</strong><br>MD Pathologist</p>
        </div>
    <img th:src="'data:image/png;base64,' + ${qrCode}" alt="QR Code" style="width: 100px; height: 100px;"/>



        <div class="signature-block">
            <!-- <img th:src="/resources/static/image.png' + ${labSeal}" alt="Lab Seal"/> -->
            <img th:src="@{/images/demolabseal.png}" alt="Lab Seal"/>
            <p><strong>Official Lab Seal</strong></p>
        </div>
    </div>
</div>
    <!-- Footer -->
<!--     <div class="footer">
        RR Diagnostic Lab • Main Road, Maharashtra  
        | Mobile: 9876543210 | Email: rrdiagnosticlab@gmail.com
    </div> -->
  <div class="letterhead-footer">
    <!-- Leave empty for now, can add footer text or signature later -->
</div>

</div>

<!-- JS for Print + Save PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
    function printInvoice() {
        window.print();
    }

    async function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const invoice = document.querySelector("#invoice");

        const canvas = await html2canvas(invoice, { scale: 2 });
        const imgData = canvas.toDataURL("image/png");
        
        const pdf = new jsPDF("p", "mm", "a4");
        const width = pdf.internal.pageSize.getWidth();
        const height = (canvas.height * width) / canvas.width;

        pdf.addImage(imgData, "PNG", 0, 0, width+0.2, height);
        pdf.save(`RR-Lab-Invoice-${patientName}-${patientId}.pdf`);

    }
</script>

</body>
</html>
