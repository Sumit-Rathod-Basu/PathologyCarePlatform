<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lab Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #3b82f6;
            --secondary: #06b6d4;
            --accent: #8b5cf6;
            --background: #f0f9ff;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #cbd5e1;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe, #dbeafe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .register-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .register-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        h2 {
            text-align: center;
            color: var(--text);
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            font-weight: 500;
            color: var(--text);
            margin-bottom: 8px;
            display: block;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .input-container {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #f8fafc;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            transform: translateY(-2px);
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 18px;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 16px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        p {
            text-align: center;
            font-size: 15px;
            margin-top: 20px;
            color: var(--text-light);
        }

        a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            cursor: pointer;
            font-size: 18px;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            border-radius: 2px;
            background: #e2e8f0;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-weak {
            background: var(--error);
            width: 30%;
        }

        .strength-medium {
            background: #f59e0b;
            width: 60%;
        }

        .strength-strong {
            background: var(--success);
            width: 100%;
        }

        /* Animation for form elements */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }
        .form-group:nth-child(6) { animation-delay: 0.6s; }
        .form-group:nth-child(7) { animation-delay: 0.7s; }
        .form-group:nth-child(8) { animation-delay: 0.8s; }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .register-card {
                padding: 30px 25px;
            }
            
            h2 {
                font-size: 24px;
            }
            
            input {
                padding: 12px 12px 12px 40px;
            }
            
            .input-icon {
                left: 12px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="register-card">
    <h2>
        <i class="fas fa-flask"></i> Register Your Laboratory
    </h2>

    <form action="/lab/register" method="post">
        <div class="form-group">
            <label for="labName">Laboratory Name</label>
            <div class="input-container">
                <input type="text" id="labName" name="labName" placeholder="Enter laboratory name" required>
                <div class="input-icon">
                    <i class="fas fa-hospital"></i>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email (Login ID)</label>
            <div class="input-container">
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-container">
                <input type="password" id="password" name="password" placeholder="Create a password" required>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <span class="password-toggle" id="passwordToggle">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
            <div class="password-strength">
                <div class="strength-bar" id="passwordStrength"></div>
            </div>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <div class="input-container">
                <input type="text" id="phone" name="phone" placeholder="Enter phone number" required>
                <div class="input-icon">
                    <i class="fas fa-phone"></i>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="address">Complete Address</label>
            <div class="input-container">
                <input type="text" id="address" name="address" placeholder="Enter complete address" required>
                <div class="input-icon">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="city">City</label>
            <div class="input-container">
                <input type="text" id="city" name="city" placeholder="Enter city" required>
                <div class="input-icon">
                    <i class="fas fa-city"></i>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="pincode">Pincode</label>
            <div class="input-container">
                <input type="text" id="pincode" name="pincode" placeholder="Enter pincode" required>
                <div class="input-icon">
                    <i class="fas fa-map-pin"></i>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="registrationNumber">Registration / License Number</label>
            <div class="input-container">
                <input type="text" id="registrationNumber" name="registrationNumber" placeholder="Enter registration number" required>
                <div class="input-icon">
                    <i class="fas fa-id-card"></i>
                </div>
            </div>
        </div>

        <button type="submit">
            <i class="fas fa-user-plus"></i> Register Laboratory
        </button>
    </form>

    <p>Already Registered? <a href="/lab-login">Login to your account</a></p>
</div>

<script>
    // Password strength indicator
    document.getElementById('password').addEventListener('input', function() {
        const password = this.value;
        const strengthBar = document.getElementById('passwordStrength');
        
        // Reset classes
        strengthBar.className = 'strength-bar';
        
        if (password.length === 0) {
            strengthBar.style.width = '0%';
            return;
        }
        
        // Calculate strength
        let strength = 0;
        if (password.length >= 6) strength += 1;
        if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength += 1;
        if (password.match(/\d/)) strength += 1;
        if (password.match(/[^a-zA-Z\d]/)) strength += 1;
        
        // Update strength bar
        if (strength <= 1) {
            strengthBar.classList.add('strength-weak');
        } else if (strength <= 2) {
            strengthBar.classList.add('strength-medium');
        } else {
            strengthBar.classList.add('strength-strong');
        }
    });
    
    // Password visibility toggle
    document.getElementById('passwordToggle').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const icon = this.querySelector('i');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });
</script>
</body>
</html>
