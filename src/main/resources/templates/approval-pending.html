<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Approval Pending</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #dbe4f3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 50px 40px;
            width: 420px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.6s ease-in-out;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: #f6c23e;
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        h2 {
            margin-bottom: 15px;
            color: #f6c23e;
        }

        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin: 10px 0;
        }

        .btn {
            margin-top: 25px;
            padding: 10px 25px;
            background: #4e73df;
            color: white;
            border: none;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s ease;
            display: inline-block;
        }

        .btn:hover {
            background: #2e59d9;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⏳</div>

        <h2>Approval Pending</h2>

        <p>Your laboratory account is currently under administrative review.</p>
        <p>You will receive a confirmation email once your registration is approved.</p>

        <a href="/labs/login" class="btn">Back to Login</a>
    </div>

</body>
</html>
