<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Invoice - [[${patientName}]]</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 20px;
        }
        .invoice-box {
            max-width: 900px;
            margin: auto;
            padding: 30px;
            border: 1px solid #eee;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }
        .invoice-header {
            margin-bottom: 20px;
        }
        .invoice-header h1 {
            font-size: 28px;
            font-weight: bold;
        }
        .invoice-details, .invoice-footer {
            margin-top: 20px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .qr-barcode {
            display: flex;
            gap: 50px;
            margin-top: 20px;
        }
        .qr-barcode img {
            border: 1px solid #ddd;
            padding: 5px;
        }
        .text-end {
            text-align: right;
        }
        .btn-print {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="invoice-box">
        <div class="invoice-header text-center">
            <h1>Pathology Invoice</h1>
            <p><strong>Date:</strong>
    <span th:text="${billDate}"></span>
</p>

        </div>

        <div class="row invoice-details">
            <div class="col-md-6">
                <h5>Patient Details:</h5>
                <p><strong>Name:</strong> <span th:text="${patientName}"></span></p>
                <p><strong>Mobile:</strong> <span th:text="${patientMobile}"></span></p>
                <p><strong>Email:</strong> <span th:text="${patientEmail}"></span></p>
            </div>
            <div class="col-md-6 text-end">
                <div class="qr-barcode justify-content-end">
                    <div>
                        <p><strong>QR Code</strong></p>
                        <img th:src="'data:image/png;base64,' + ${qrCode}" alt="QR Code" width="150" height="150">
                    </div>
                    <div>
                        <p><strong>Barcode</strong></p>
                        <img th:src="'data:image/png;base64,' + ${barcode}" alt="Barcode" width="150" height="50">
                    </div>
                </div>
            </div>
        </div>

        <div class="table-responsive mt-4">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Test Name</th>
                        <th>Price</th>
                        <th>Discount</th>
                        <th>Total Price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item, iterStat : ${bill}">
                        <td th:text="${iterStat.count}"></td>
                        <td th:text="${item.testName}"></td>
                        <td th:text="${item.price}"></td>
                        <td th:text="${item.discount}"></td>
                        <td th:text="${item.totalPrice}"></td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <th colspan="4" class="text-end">Grand Total:</th>
                        <th th:text="${grandTotal}"></th>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="invoice-footer text-center">
            <p>Thank you for choosing our Pathology Lab!</p>
            <button class="btn btn-primary btn-print" onclick="window.print();">Print Invoice</button>
        </div>
    </div>
</body>
</html>
