<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Test</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-4">
    <div class="card p-4 shadow">

        <h3>Edit Test</h3>

        <form th:action="@{/lab/test/update}" method="post" th:object="${test}">

            <input type="hidden" th:field="*{id}">

            <div class="mt-3">
                <label class="form-label">Test Name</label>
                <input type="text" class="form-control" th:field="*{testName}">
            </div>

            <div class="mt-3">
                <label class="form-label">Category</label>
                <input type="text" class="form-control" th:field="*{category}">
            </div>

            <div class="mt-3">
                <label class="form-label">Price</label>
                <input type="number" class="form-control" th:field="*{price}">
            </div>

            <div class="mt-3">
                <label class="form-label">Sample Type</label>
                <select class="form-select" th:field="*{sampleType}">
                    <option>Blood</option>
                    <option>Urine</option>
                    <option>Swab</option>
                </select>
            </div>

            <div class="mt-3">
                <label class="form-label">Report Time</label>
                <select class="form-select" th:field="*{reportTime}">
                    <option>Same Day</option>
                    <option>24 Hours</option>
                    <option>48 Hours</option>
                </select>
            </div>

            <div class="mt-3">
                <label class="form-label">Status</label>
                <select class="form-select" th:field="*{status}">
                    <option>Active</option>
                    <option>Inactive</option>
                </select>
            </div>

            <button class="btn btn-primary mt-4">Update Test</button>
        </form>

    </div>
</div>

</body>
</html>
