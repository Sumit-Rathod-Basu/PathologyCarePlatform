<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
            background-color: #f8f9fa;
        }
        .error-box {
            background: white;
            padding: 40px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }
        h1 {
            color: red;
        }
        a {
            text-decoration: none;
            color: white;
            background: #007bff;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="error-box">
    <h1>Oops! Something went wrong</h1>

    <p th:text="'Status Code: ' + ${status}"></p>
    <p th:text="'Error: ' + ${error}"></p>
    <p th:text="'Message: ' + ${message}"></p>

    <br>
    <a th:href="@{/}">Go to Home</a>
</div>

</body>
</html>
