<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Reports · enhanced</title>
    <!-- Font Awesome for crisp icons (optional but adds polish) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* modern & clean report table styling — improved spacing, colors, responsiveness */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4fa;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .section {
            background: #ffffff;
            padding: 2rem 1.8rem;
            border-radius: 24px;
            box-shadow: 0 20px 35px -8px rgba(0, 20, 30, 0.15), 0 5px 10px -4px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 1300px;
            transition: box-shadow 0.2s;
        }

        .section:hover {
            box-shadow: 0 24px 40px -12px rgba(17, 45, 78, 0.2);
        }

        .section-title {
            margin-bottom: 1.8rem;
            color: #1e293b;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-left: 8px solid #3b82f6;
            padding-left: 1.2rem;
        }

        .section-title i {
            color: #3b82f6;
            background: #eef2ff;
            padding: 0.6rem;
            border-radius: 14px;
            font-size: 1.5rem;
        }

        /* table styling — clean, airy, professional */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            margin-top: 0.5rem;
        }

        thead {
            background: transparent;
        }

        th {
            background: #f8fafc;
            color: #1e293b;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 1rem 0.8rem;
            border: none;
            text-align: center;
            border-bottom: 2px solid #cbd5e1;
            white-space: nowrap;
        }

        td {
            background-color: #ffffff;
            padding: 1rem 0.8rem;
            text-align: center;
            border: none;
            box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.03), 0 0 0 1px rgba(148, 163, 184, 0.1);
            font-size: 1rem;
            color: #1f2937;
            transition: background 0.15s, box-shadow 0.15s;
            border-radius: 0;  /* reset for first/last child rounding */
        }

        /* soft row rounding */
        tr td:first-child {
            border-top-left-radius: 18px;
            border-bottom-left-radius: 18px;
        }

        tr td:last-child {
            border-top-right-radius: 18px;
            border-bottom-right-radius: 18px;
        }

        /* row hover effect */
        tr:hover td {
            background-color: #fcfdff;
            box-shadow: 0 6px 14px -4px rgba(37, 99, 235, 0.15), 0 0 0 1px #b1c3df;
        }

        /* alternate background removed — we use clean white, but subtle distinction kept via shadow.
           we keep even row slightly tinted (very light) */
        tr:nth-child(even) td {
            background-color: #fafcff;
        }
        tr:nth-child(even):hover td {
            background-color: #f5f9ff;
        }

        /* button styling — modern pill shape, icons, better contrast */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem 1.4rem;
            text-decoration: none;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            white-space: nowrap;
            box-shadow: 0 4px 8px -2px rgba(0, 0, 0, 0.05);
            line-height: 1;
            min-width: 90px;
        }

        .btn i {
            font-size: 0.95rem;
        }

        .btn-view {
            background-color: #eef2ff;
            color: #2563eb;
            border-color: #cbd5e1;
            margin-right: 8px;
        }

        .btn-view:hover {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
            box-shadow: 0 10px 18px -6px #3b82f6;
            transform: translateY(-2px);
        }

        .btn-download {
            background-color: #ecfdf5;
            color: #059669;
            border-color: #cbd5e1;
        }

        .btn-download:hover {
            background-color: #059669;
            color: white;
            border-color: #059669;
            box-shadow: 0 10px 18px -6px #10b981;
            transform: translateY(-2px);
        }

        /* action cell layout: flex for side by side on wide */
        td:last-child {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            border: none;
            background: inherit;  /* keep background consistent */
        }

        /* we need to preserve background on hover for cell, but anchor background separate */
        td:last-child a {
            flex: 0 1 auto;
        }

        /* no data message — softer and friendly */
        .no-data {
            color: #6b7280;
            margin-top: 2rem;
            font-weight: 500;
            font-size: 1.2rem;
            text-align: center;
            background: #f9fafb;
            padding: 2.5rem 2rem;
            border-radius: 60px;
            border: 1px dashed #9ca3af;
            width: 100%;
        }

        .no-data i {
            font-size: 2rem;
            color: #9ca3af;
            margin-bottom: 0.5rem;
            display: block;
        }

        /* responsive design: stack on mobile */
        @media (max-width: 700px) {
            body {
                padding: 12px;
                align-items: flex-start;
            }

            .section {
                padding: 1.5rem 1rem;
            }

            .section-title {
                font-size: 1.7rem;
                border-left-width: 6px;
                padding-left: 0.8rem;
            }

            /* make table block scroll */
            table {
                display: block;
                width: 100%;
                border-spacing: 0 6px;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            th, td {
                white-space: nowrap;
                padding: 0.9rem 0.6rem;
                font-size: 0.9rem;
            }

            td:last-child {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                min-width: 110px;
                padding: 0.6rem 0.8rem;
                width: 100%;
            }
        }

        /* extra small screens */
        @media (max-width: 420px) {
            .btn {
                font-size: 0.8rem;
                padding: 0.5rem 0.3rem;
            }
            .btn i {
                display: none;  /* hide icons if screen too crowded */
            }
        }

        /* optional tooltip / none */
        th:first-child, td:first-child {
            padding-left: 1.2rem;
            text-align: left;
        }

        th:last-child, td:last-child {
            padding-right: 1.2rem;
        }

        /* fix for hover on action cell (background conflict) */
        tr:hover td:last-child {
            background: inherit; 
        }
        tr:hover td:last-child .btn-view {
            /* keep button hover independent */
        }

        /* remove double border from thead */
        thead tr th {
            background: transparent;
            border-bottom: 2px solid #cbd5e1;
        }

        /* subtle addition: add micro-interaction to patient name */
        td:first-child {
            font-weight: 500;
            color: #0b3b5c;
        }

        /* noData icon only if font-awesome loaded */
        .no-data i.fa-regular, 
        .no-data i.fa-solid {
            display: block;
        }
    </style>
</head>

<body>

<section class="section">

    <h2 class="section-title">
        <i class="fa-solid fa-folder-open"></i> 
        My Reports
    </h2>

    <div th:if="${reports != null and !#lists.isEmpty(reports)}">
        <table>
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Actions</th>
                </tr>
            </thead>
 
            <tbody>
                <tr th:each="report : ${reports}">
                    <td th:text="${report.patientName}">John Carter</td>
                    <td th:text="${report.patientEmail}">john.c@example.com</td>
                    <td th:text="${report.patientMobile}">+1 234 567 890</td>
                    <td>
                        <a th:href="@{'/bill/invoice/' + ${report.patientId}}"
                           class="btn btn-view">
                            <i class="fa-regular fa-eye"></i> View
                        </a>

                        <a th:href="@{'/invoice/' + ${report.id}}"
                           class="btn btn-download">
                            <i class="fa-regular fa-circle-down"></i> Download
                        </a>
                    </td>
                </tr>
                <!-- additional static row to show design (dummy) - will be replaced by thymeleaf -->
      
            </tbody>
        </table>
    </div>

    <div th:if="${reports == null or #lists.isEmpty(reports)}">
        <p class="no-data">
            <i class="fa-regular fa-file-lines"></i><br>
            No Reports Available
        </p>
    </div>

</section>

</body>
</html>
