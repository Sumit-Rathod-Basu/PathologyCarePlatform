<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report Generated Successfully</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #e8fdf3, #ffffff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-container {
            background: #ffffff;
            padding: 40px 30px;
            width: 360px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: zoomIn 0.6s ease;
        }

        @keyframes zoomIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Tick Circle */
        .checkmark-wrapper {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #e7fff3;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            animation: pop 0.8s ease;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .checkmark {
            width: 55px;
            height: 30px;
            border-left: 6px solid #00b386;
            border-bottom: 6px solid #00b386;
            transform: rotate(-45deg);
        }

        h2 {
            color: #00b386;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #555;
            margin-bottom: 6px;
        }

        .info {
            background: #f6fdfb;
            border-radius: 12px;
            padding: 12px;
            margin-top: 20px;
            font-size: 13px;
            color: #333;
        }

        .info span {
            display: block;
            margin-top: 6px;
            color: #777;
        }

        .btn {
            margin-top: 25px;
            padding: 12px;
            width: 100%;
            background: linear-gradient(135deg, #00b386, #00e0a8);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 179, 134, 0.3);
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body oncontextmenu="return false">

<div class="success-container">
    <div class="checkmark-wrapper">
        <div class="checkmark"></div>
    </div>

    <h2>Report Generated</h2>
    <p>Your pathology report is ready</p>

    <div class="info">
        <strong th:text="'Patient ID : ' + ${patientId}">Patient ID : PT1023</strong>
        <span th:text="'Report ID : ' + ${reportId}">Report ID : RP5587</span>
        <span th:text="'Generated On : ' + ${generatedDate}">Generated On : 03 Jan 2026</span>
    </div>

    <button class="btn" th:onclick="|window.location='@{/reports/view/{id}(id=${reportId})}'|">
        View Report
    </button>

    <div class="footer">
        RR Diagnostic Lab ✔ Secure & Verified
    </div>
</div>

<script>
    // Disable common inspect shortcuts
    document.addEventListener('keydown', function (e) {
        if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.ctrlKey && e.key === "U")) {
            e.preventDefault();
        }
    });
</script>

</body>
</html>
