<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success - Pathology Care Platform</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Container -->
    <div class="min-h-screen flex items-center justify-center px-4">
        
        <div class="bg-white shadow-xl rounded-2xl p-10 max-w-md text-center">

            <!-- Success Icon -->
            <div class="flex justify-center mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" 
                     class="h-20 w-20 text-green-500" 
                     fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M5 13l4 4L19 7"/>
                </svg>
            </div>

            <!-- Title -->
            <h1 class="text-3xl font-bold text-gray-800 mb-3">
                Success!
            </h1>

            <!-- Message -->
            <p class="text-gray-600 text-lg mb-6">
                Patient details have been saved successfully.
            </p>

            <!-- Button -->
            <a href="/" 
               class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg shadow-md text-lg transition">
                Go to Home
            </a>
        </div>

    </div>

</body>
</html>
