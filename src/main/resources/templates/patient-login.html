<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Portal - Pathology Care</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0e7490;
            --primary-dark: #155e75;
            --primary-light: #cffafe;
            --accent: #22d3ee;
            --accent-bright: #06b6d4;
            --accent-dark: #0891b2;
            --surface: #ffffff;
            --surface-alt: #f8fafc;
            --bg-body: #f0fdfa;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --error: #ef4444;
            --error-light: #fef2f2;
            --success: #10b981;
            --success-light: #f0fdf4;
            --warning: #f59e0b;
            --warning-light: #fffbeb;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            --shadow-xl: 0 20px 50px -10px rgba(14, 116, 144, 0.2);
            --radius: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background: linear-gradient(135deg, rgba(14, 116, 144, 0.95), rgba(6, 78, 59, 0.85)),
                        url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background elements */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.1), transparent);
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            width: 400px;
            height: 400px;
            top: -100px;
            right: -100px;
            animation: float 8s ease-in-out infinite;
        }

        body::after {
            width: 300px;
            height: 300px;
            bottom: -50px;
            left: -50px;
            animation: float 8s ease-in-out infinite 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(30px) translateX(20px); }
        }

        /* Main container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
        }

        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 8px 20px rgba(34, 211, 238, 0.3);
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-bright) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        /* Toggle tabs */
        .tab-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .tab-btn {
            padding: 14px 20px;
            border: 2px solid var(--border-light);
            background: rgba(255, 255, 255, 0.7);
            color: var(--text-muted);
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            backdrop-filter: blur(5px);
        }

        .tab-btn:hover {
            border-color: var(--primary);
            background: rgba(207, 250, 254, 0.3);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(14, 116, 144, 0.3);
        }

        /* Forms container */
        .forms-wrapper {
            position: relative;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: slideInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 2;
            display: none;
        }

        .form-card.active {
            display: block;
            animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--accent), var(--primary), var(--accent-bright));
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            background-size: 200% 100%;
            animation: gradient-shift 3s ease infinite;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-title {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-title i {
            color: var(--accent);
        }

        /* Form groups */
        .form-group {
            position: relative;
            margin-bottom: 18px;
            animation: slideInUp 0.6s ease-out;
        }

        .form-group:nth-child(n+2) {
            animation-delay: 0.05s;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .required {
            color: var(--error);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px 14px 12px 44px;
            border: 2px solid var(--border-light);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.7);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 500;
            transition: var(--transition);
            backdrop-filter: blur(5px);
        }

        textarea {
            padding: 12px 14px;
            min-height: 100px;
            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(100, 116, 139, 0.6);
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(207, 250, 254, 0.4);
            box-shadow: 0 0 0 4px rgba(14, 116, 144, 0.1), 0 4px 12px rgba(34, 211, 238, 0.2);
            transform: translateY(-2px);
        }

        /* Input icons */
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            transition: var(--transition);
            pointer-events: none;
        }

        input:focus + .input-icon,
        select:focus + .input-icon {
            color: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        /* Select arrow */
        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-right: 40px;
            cursor: pointer;
        }

        .select-arrow {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 12px;
            pointer-events: none;
            transition: var(--transition);
        }

        select:focus ~ .select-arrow {
            color: var(--primary);
            transform: translateY(-50%) rotate(180deg);
        }

        /* Two column layout */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* Password strength */
        .password-strength-bar {
            height: 6px;
            background: rgba(226, 232, 240, 0.4);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .strength-indicator {
            height: 100%;
            width: 0;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s ease;
            border-radius: 3px;
            box-shadow: 0 0 8px rgba(34, 211, 238, 0.3);
        }

        .strength-indicator.strength-weak {
            background: linear-gradient(90deg, #ef4444, #f87171);
            width: 33%;
        }

        .strength-indicator.strength-medium {
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            width: 66%;
        }

        .strength-indicator.strength-strong {
            background: linear-gradient(90deg, #10b981, #34d399);
            width: 100%;
        }

        .strength-text {
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
            color: var(--text-muted);
        }

        /* OTP Box */
        .otp-box {
            background: linear-gradient(135deg, rgba(207, 250, 254, 0.3), rgba(240, 253, 250, 0.3));
            border: 2px solid rgba(34, 211, 238, 0.3);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-top: 20px;
            animation: slideInUp 0.6s ease-out;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .otp-box::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.2), transparent);
            border-radius: 50%;
            pointer-events: none;
        }

        .otp-title {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .otp-title i {
            animation: pulse-icon 2s ease-in-out infinite;
        }

        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        .otp-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
            position: relative;
            z-index: 1;
        }

        .otp-btn {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .otp-btn.send {
            background: linear-gradient(135deg, var(--accent), var(--accent-bright));
            color: white;
            box-shadow: 0 4px 12px rgba(34, 211, 238, 0.3);
        }

        .otp-btn.send:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(34, 211, 238, 0.4);
        }

        .otp-btn.verify {
            background: linear-gradient(135deg, var(--success), #34d399);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .otp-btn.verify:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        .otp-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .otp-message {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            animation: slideInUp 0.3s ease-out;
            position: relative;
            z-index: 1;
        }

        .otp-message.success {
            background: linear-gradient(135deg, var(--success-light), rgba(16, 185, 129, 0.05));
            color: #047857;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .otp-message.error {
            background: linear-gradient(135deg, var(--error-light), rgba(239, 68, 68, 0.05));
            color: #991b1b;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* Alert messages */
        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideDownFade 0.4s ease-out;
            border: 1px solid;
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 3;
        }

        .alert.error {
            background: linear-gradient(135deg, var(--error-light), rgba(239, 68, 68, 0.05));
            color: var(--error);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .alert.success {
            background: linear-gradient(135deg, var(--success-light), rgba(16, 185, 129, 0.05));
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.2);
        }

        .alert i {
            font-size: 18px;
            flex-shrink: 0;
        }

        @keyframes slideDownFade {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 6px 20px rgba(14, 116, 144, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-submit:hover:not(:disabled)::before {
            left: 100%;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(14, 116, 144, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit.loading {
            pointer-events: none;
        }

        .btn-submit.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px 16px;
            }

            .form-card {
                padding: 30px 24px;
            }

            .header h1 {
                font-size: 28px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .tab-buttons {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px 12px;
            }

            .form-card {
                padding: 24px 18px;
                border-radius: 16px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header p {
                font-size: 13px;
            }

            .logo {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            input[type="tel"],
            select,
            textarea {
                padding: 11px 12px 11px 40px;
                font-size: 16px;
            }

            .form-label {
                font-size: 13px;
            }

            .form-title {
                font-size: 18px;
            }

            .otp-buttons {
                grid-template-columns: 1fr;
            }

            .btn-submit {
                padding: 12px 18px;
                font-size: 14px;
                margin-top: 16px;
            }

            .tab-btn {
                font-size: 12px;
                padding: 12px 16px;
            }
        }

        /* Accessibility */
        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(34, 211, 238, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo-section">
            <div class="logo">
                <i class="fas fa-microscope"></i>
            </div>
            <div>
                <h1>Pathology Care</h1>
                <p>Secure Patient Portal</p>
            </div>
        </div>
    </div>

    <!-- Alert Messages -->
    <div th:if="${error}" class="alert error" role="alert">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${error}">An error occurred</span>
    </div>
    <div th:if="${success}" class="alert success" role="status">
        <i class="fas fa-check-circle"></i>
        <span th:text="${success}">Success!</span>
    </div>

    <!-- Tab Buttons -->
    <div class="tab-buttons" role="tablist">
        <button class="tab-btn active" onclick="switchForm('login')" role="tab" aria-selected="true" aria-controls="loginForm">
            <i class="fas fa-sign-in-alt"></i>
            <span>Sign In</span>
        </button>
        <button class="tab-btn" onclick="switchForm('register')" role="tab" aria-selected="false" aria-controls="registerForm">
            <i class="fas fa-user-plus"></i>
            <span>Register</span>
        </button>
    </div>

    <!-- Forms Container -->
    <div class="forms-wrapper">

        <!-- LOGIN FORM -->
        <div class="form-card active" id="loginForm" role="tabpanel" aria-labelledby="loginTab">
            <div class="form-title">
                <i class="fas fa-lock"></i>
                Sign In to Your Account
            </div>

            <form th:action="@{/patients/patient/login}" method="post">
                <div class="form-group">
                    <label class="form-label">Email Address <span class="required">*</span></label>
                    <div style="position: relative;">
                        <input 
                            type="email" 
                            name="email" 
                            placeholder="your.email@example.com"
                            required
                            aria-label="Email Address"
                        />
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password <span class="required">*</span></label>
                    <div style="position: relative;">
                        <input 
                            type="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                            aria-label="Password"
                        />
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-sign-in-alt"></i>
                    Login to Portal
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 14px;">
                Don't have an account? <button onclick="switchForm('register')" style="background: none; border: none; color: var(--primary); cursor: pointer; font-weight: 600; text-decoration: underline;">Register here</button>
            </div>
        </div>

        <!-- REGISTRATION FORM -->
        <div class="form-card" id="registerForm" role="tabpanel" aria-labelledby="registerTab">
            <div class="form-title">
                <i class="fas fa-user-check"></i>
                Create Your Account
            </div>

            <form id="registrationForm" th:action="@{/patients/insert}" method="post">
                <!-- Step 1: Personal Information -->
                <div class="form-group">
                    <label class="form-label">Full Legal Name <span class="required">*</span></label>
                    <div style="position: relative;">
                        <input 
                            type="text" 
                            name="name" 
                            placeholder="Enter your full name"
                            required
                            aria-label="Full Name"
                        />
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Date of Birth <span class="required">*</span></label>
                        <div style="position: relative;">
                            <input 
                                type="text" 
                                name="dob" 
                                placeholder="DD/MM/YYYY"
                                required
                                aria-label="Date of Birth"
                            />
                            <i class="fas fa-calendar input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Gender <span class="required">*</span></label>
                        <div style="position: relative;">
                            <select name="gender" required aria-label="Gender">
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                            <i class="fas fa-venus-mars input-icon"></i>
                            <i class="fas fa-chevron-down select-arrow"></i>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Contact Information -->
                <div class="form-group">
                    <label class="form-label">Email Address <span class="required">*</span></label>
                    <div style="position: relative;">
                        <input 
                            type="email" 
                            name="email" 
                            id="mainEmail"
                            placeholder="your.email@example.com"
                            required
                            aria-label="Email Address"
                        />
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number <span class="required">*</span></label>
                    <div style="position: relative;">
                        <input 
                            type="tel" 
                            name="phone" 
                            placeholder="+91 XXXXX XXXXX"
                            required
                            aria-label="Phone Number"
                        />
                        <i class="fas fa-phone input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Address <span class="required">*</span></label>
                    <div style="position: relative;">
                        <textarea 
                            name="address" 
                            placeholder="Enter your complete address"
                            required
                            aria-label="Address"
                        ></textarea>
                        <i class="fas fa-map-marker-alt input-icon" style="top: 16px;"></i>
                    </div>
                </div>

                <!-- Step 3: Security -->
                <div class="form-group">
                    <label class="form-label">Password <span class="required">*</span></label>
                    <div style="position: relative;">
                        <input 
                            type="password" 
                            name="password" 
                            id="passwordInput"
                            placeholder="Create a strong password"
                            required
                            aria-label="Password"
                        />
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                    <div class="password-strength-bar">
                        <div id="passwordStrengthIndicator" class="strength-indicator"></div>
                    </div>
                    <div class="strength-text" id="strengthText">Password strength: Weak</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password <span class="required">*</span></label>
                    <div style="position: relative;">
                        <input 
                            type="password" 
                            name="confirmPassword" 
                            id="confirmPasswordInput"
                            placeholder="Confirm your password"
                            required
                            aria-label="Confirm Password"
                        />
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                </div>

                <!-- Step 4: Verification -->
                <div class="otp-box">
                    <div class="otp-title">
                        <i class="fas fa-shield-alt"></i>
                        Email Verification
                    </div>

                    <div class="form-group" style="margin-bottom: 12px;">
                        <label class="form-label">Email for OTP <span class="required">*</span></label>
                        <div style="position: relative;">
                            <input 
                                type="email" 
                                id="emailOtp" 
                                placeholder="Email address for OTP"
                                required
                                aria-label="Email for OTP"
                            />
                            <i class="fas fa-envelope input-icon"></i>
                        </div>
                    </div>

                    <div class="otp-buttons">
                        <button type="button" class="otp-btn send" onclick="sendOtp()" aria-label="Send OTP">
                            <i class="fas fa-paper-plane"></i>
                            <span>Send OTP</span>
                        </button>
                        <button type="button" class="otp-btn verify" onclick="verifyOtp()" id="verifyOtpBtn" aria-label="Verify OTP">
                            <i class="fas fa-check"></i>
                            <span>Verify</span>
                        </button>
                    </div>

                    <div class="form-group" style="margin-top: 12px;">
                        <label class="form-label">Enter OTP <span class="required">*</span></label>
                        <div style="position: relative;">
                            <input 
                                type="text" 
                                id="otp" 
                                placeholder="000000"
                                maxlength="6"
                                inputmode="numeric"
                                required
                                aria-label="One-Time Password"
                            />
                            <i class="fas fa-key input-icon"></i>
                        </div>
                    </div>

                    <div class="otp-message" id="otpMessage" role="status" aria-live="polite"></div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn" disabled aria-disabled="true">
                    <i class="fas fa-user-check"></i>
                    Complete Registration
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 14px;">
                Already have an account? <button onclick="switchForm('login')" style="background: none; border: none; color: var(--primary); cursor: pointer; font-weight: 600; text-decoration: underline;">Sign in here</button>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
    let otpVerified = false;

    // Switch between forms
    function switchForm(form) {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const tabs = document.querySelectorAll('.tab-btn');

        if (form === 'login') {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
            tabs[0].setAttribute('aria-selected', 'true');
            tabs[1].setAttribute('aria-selected', 'false');
        } else {
            loginForm.classList.remove('active');
            registerForm.classList.add('active');
            tabs[0].classList.remove('active');
            tabs[1].classList.add('active');
            tabs[0].setAttribute('aria-selected', 'false');
            tabs[1].setAttribute('aria-selected', 'true');
        }
    }

    // Password strength checker
    function checkPasswordStrength(password) {
        const strengthBar = document.getElementById('passwordStrengthIndicator');
        const strengthText = document.getElementById('strengthText');
        
        if (!strengthBar) return;

        let strength = 0;
        if (password.length >= 8) strength++;
        if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
        if (/\d/.test(password)) strength++;
        if (/[^a-zA-Z\d]/.test(password)) strength++;

        strengthBar.className = 'strength-indicator';
        
        if (password.length === 0) {
            strengthBar.style.width = '0';
            strengthText.textContent = 'Password strength: Weak';
        } else if (strength <= 2) {
            strengthBar.classList.add('strength-weak');
            strengthText.textContent = 'Password strength: Weak';
        } else if (strength === 3) {
            strengthBar.classList.add('strength-medium');
            strengthText.textContent = 'Password strength: Good';
        } else {
            strengthBar.classList.add('strength-strong');
            strengthText.textContent = 'Password strength: Strong';
        }
    }

    // Validate password match
    function validatePassword() {
        const password = document.querySelector('#registrationForm input[name="password"]');
        const confirmPassword = document.querySelector('#registrationForm input[name="confirmPassword"]');

        if (password && confirmPassword) {
            if (password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity("Passwords don't match");
            } else {
                confirmPassword.setCustomValidity('');
            }
        }
    }

    // Send OTP
    function sendOtp() {
        const email = document.getElementById('emailOtp').value.trim();
        const messageDiv = document.getElementById('otpMessage');
        const sendBtn = document.querySelector('.otp-btn.send');

        messageDiv.textContent = '';
        messageDiv.className = 'otp-message';

        if (!email) {
            messageDiv.textContent = '❌ Please enter your email address!';
            messageDiv.classList.add('error');
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            messageDiv.textContent = '❌ Please enter a valid email address!';
            messageDiv.classList.add('error');
            return;
        }

        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fas fa-spinner"></i> Sending...';
        otpVerified = false;
        updateSubmitButton();

        fetch(`/patients/send-otp?email=${encodeURIComponent(email)}`)
            .then(response => response.json())
            .then(data => {
                messageDiv.innerHTML = `✅ OTP sent! Check your email. <strong>(Test: ${data.otp})</strong>`;
                messageDiv.classList.add('success');
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
            })
            .catch(error => {
                console.error('OTP send error:', error);
                messageDiv.textContent = '❌ Error sending OTP. Please try again.';
                messageDiv.classList.add('error');
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
            });
    }

    // Verify OTP
    function verifyOtp() {
        const email = document.getElementById('emailOtp').value.trim();
        const otp = document.getElementById('otp').value.trim();
        const messageDiv = document.getElementById('otpMessage');
        const verifyBtn = document.getElementById('verifyOtpBtn');

        messageDiv.textContent = '';
        messageDiv.className = 'otp-message';

        if (!email || !otp) {
            messageDiv.textContent = '❌ Please enter both email and OTP!';
            messageDiv.classList.add('error');
            return;
        }

        if (otp.length !== 6 || !/^\d{6}$/.test(otp)) {
            messageDiv.textContent = '❌ OTP must be a 6-digit number!';
            messageDiv.classList.add('error');
            return;
        }

        verifyBtn.disabled = true;
        verifyBtn.innerHTML = '<i class="fas fa-spinner"></i> Verifying...';

        fetch('/patients/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `email=${encodeURIComponent(email)}&otp=${encodeURIComponent(otp)}`
        })
        .then(response => response.text().then(text => ({ status: response.status, text })))
        .then(result => {
            verifyBtn.disabled = false;
            verifyBtn.innerHTML = '<i class="fas fa-check"></i> Verify';

            if (result.status === 200) {
                messageDiv.innerHTML = `✅ ${result.text}`;
                messageDiv.classList.add('success');
                otpVerified = true;
                updateSubmitButton();
            } else {
                messageDiv.innerHTML = `❌ ${result.text}`;
                messageDiv.classList.add('error');
                otpVerified = false;
                updateSubmitButton();
            }
        })
        .catch(error => {
            console.error('OTP verification error:', error);
            messageDiv.textContent = '❌ Error verifying OTP. Please try again.';
            messageDiv.classList.add('error');
            otpVerified = false;
            verifyBtn.disabled = false;
            verifyBtn.innerHTML = '<i class="fas fa-check"></i> Verify';
            updateSubmitButton();
        });
    }

    // Update submit button
    function updateSubmitButton() {
        const submitBtn = document.getElementById('submitBtn');
        if (otpVerified) {
            submitBtn.disabled = false;
            submitBtn.setAttribute('aria-disabled', 'false');
        } else {
            submitBtn.disabled = true;
            submitBtn.setAttribute('aria-disabled', 'true');
        }
    }

    // Setup email auto-fill
    function setupEmailAutoFill() {
        const mainEmail = document.getElementById('mainEmail');
        const otpEmail = document.getElementById('emailOtp');

        if (mainEmail && otpEmail) {
            mainEmail.addEventListener('input', () => {
                if (!otpEmail.dataset.userEdited) {
                    otpEmail.value = mainEmail.value;
                }
            });

            otpEmail.addEventListener('input', () => {
                otpEmail.dataset.userEdited = 'true';
            });

            otpEmail.addEventListener('change', () => {
                if (otpEmail.value === '') {
                    otpEmail.dataset.userEdited = 'false';
                }
            });
        }
    }

    // Form validation
    function setupFormValidation() {
        const form = document.getElementById('registrationForm');

        form.addEventListener('submit', function(e) {
            if (!otpVerified) {
                e.preventDefault();
                const messageDiv = document.getElementById('otpMessage');
                messageDiv.innerHTML = '❌ Please verify your email OTP before submitting!';
                messageDiv.classList.add('error');
                document.querySelector('.otp-box').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    }

    // DOM initialization
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.querySelector('#registrationForm input[name="password"]');
        const confirmPasswordInput = document.querySelector('#registrationForm input[name="confirmPassword"]');

        if (passwordInput) {
            passwordInput.addEventListener('input', function() {
                checkPasswordStrength(this.value);
                validatePassword();
            });
        }

        if (confirmPasswordInput) {
            confirmPasswordInput.addEventListener('input', validatePassword);
        }

        setupEmailAutoFill();
        setupFormValidation();
    });
</script>

</body>
</html>
